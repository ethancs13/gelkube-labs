# An Argo CD Application: "keep the cluster matching k8s/apps/hello-gelkube in this repo"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-gelkube
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ethancs13/gelkube-labs.git
    targetRevision: main
    path: k8s/apps/hello-gelkube
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  syncPolicy:
    automated:
      prune: true      # delete things that were removed from Git
      selfHeal: true   # undo changes made by hand in the cluster
    syncOptions:
      - CreateNamespace=true
