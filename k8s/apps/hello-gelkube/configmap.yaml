# The web page itself. Edit the message, push, and Argo CD rolls it out.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-gelkube-html
data:
  index.html: |
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>gelkube</title>
      <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               background: #1a1727; color: #ece8f7; font-family: system-ui, sans-serif; }
        .card { text-align: center; padding: 2rem 3rem; border: 3px solid #54de7c; border-radius: 18px; }
        h1 { color: #54de7c; margin: 0 0 .5rem; font-size: 2.5rem; }
        p { color: #968eb4; margin: .25rem 0; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>🟩 gelkube</h1>
        <p>Deployed by Argo CD, straight from GitHub.</p>
        <p>Message: <strong>hello from git</strong></p>
      </div>
    </body>
    </html>
