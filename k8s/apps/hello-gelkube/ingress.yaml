# Tells Traefik (k3s's front door on ports 80/443) to send http://gelkube/ here
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-gelkube
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-gelkube
                port:
                  number: 80
