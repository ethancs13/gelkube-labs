  <polygon points="256.0,10.0 469.0,133.0 469.0,379.0 256.0,502.0 43.0,379.0 43.0,133.0" fill="#0f0820" stroke="#0f0820" stroke-width="16" stroke-linejoin="round"/>
  <polygon points="256.0,34.0 448.3,145.0 448.3,367.0 256.0,478.0 63.7,367.0 63.7,145.0" fill="none" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round"/>
  <g clip-path="url(#inside)">
