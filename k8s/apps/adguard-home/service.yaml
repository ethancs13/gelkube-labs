# Opens DNS (53, UDP and TCP) and the web UI (3000) on gelkube itself, through k3s's ServiceLB:
#   DNS:    192.168.0.110:53   (and gelkube's Tailscale IP)
#   web UI: http://gelkube:3000
apiVersion: v1
kind: Service
metadata:
  name: adguard-home
spec:
  type: LoadBalancer
  # Local = keep the real client IP, so AdGuard Home can show which device asked for what.
  externalTrafficPolicy: Local
  selector:
    app: adguard-home
  ports:
    - { name: dns-udp, port: 53, targetPort: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 53, protocol: TCP }
    - { name: http,    port: 3000, targetPort: 3000, protocol: TCP }
