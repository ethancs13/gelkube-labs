# Jellyfin media server: the official Helm chart, with my settings from k8s/apps/jellyfin/values.yaml.
# Two sources: the chart comes from Jellyfin's Helm repo, the values file from this repo ($values).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.7.0          # pinned chart version; bump it here to upgrade
      helm:
        releaseName: jellyfin
        valueFiles:
          - $values/k8s/apps/jellyfin/values.yaml
    - repoURL: https://github.com/ethancs13/gelkube-labs.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
