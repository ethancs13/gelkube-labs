<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="gelkube logo: a gelatinous cube with the homelab's tools floating inside">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1748"/><stop offset="1" stop-color="#140b28"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ff5c"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <clipPath id="inside"><polygon points="256.0,50.0 434.4,153.0 434.4,359.0 256.0,462.0 77.6,359.0 77.6,153.0"/></clipPath>
