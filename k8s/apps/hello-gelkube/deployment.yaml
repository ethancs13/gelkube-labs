# nginx serving the page from the ConfigMap above
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-gelkube
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-gelkube
  template:
    metadata:
      labels:
        app: hello-gelkube
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: html
          configMap:
            name: hello-gelkube-html
