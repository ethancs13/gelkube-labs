# AdGuard Home: network-wide ad and tracker blocking by DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
spec:
  replicas: 1
  strategy:
    type: Recreate          # stop the old pod before starting a new one: only one may use the data folders
  selector:
    matchLabels:
      app: adguard-home
  template:
    metadata:
      labels:
        app: adguard-home
    spec:
      containers:
        - name: adguard-home
          image: adguard/adguardhome:v0.107.80   # pinned; bump here to upgrade (v1.0.0 is tagged on GitHub but its image is not on Docker Hub yet)
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: http,    containerPort: 3000, protocol: TCP }
          volumeMounts:
            - { name: conf, mountPath: /opt/adguardhome/conf }
            - { name: work, mountPath: /opt/adguardhome/work }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          # Health checks. The DNS test asks AdGuard Home itself for a domain it blocks
          # (answered from its filter lists, so it doesn't depend on the internet being up).
          # The image is Alpine-based, so busybox's nslookup is available.
          startupProbe:            # give it up to 60 s to start listening before the other checks begin
            tcpSocket: { port: 53 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:          # only send DNS traffic to it once it actually answers
            exec:
              command: ["nslookup", "doubleclick.net", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:           # if it stops answering for about a minute, restart the container
            exec:
              command: ["nslookup", "doubleclick.net", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: conf
          persistentVolumeClaim: { claimName: adguard-conf }
        - name: work
          persistentVolumeClaim: { claimName: adguard-work }
